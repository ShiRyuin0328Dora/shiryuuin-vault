<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竜の鱗・重複演出サンプル</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff2fb;background:#110a21}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 8%,#56316b,#180e2e 55%,#10091d)}
main{max-width:540px;margin:auto;padding:32px 18px 56px;text-align:center}
.eyebrow{color:#e5c68d;font-size:11px;letter-spacing:.22em}h1{font-family:serif;font-size:clamp(27px,8vw,38px);margin:12px 0 8px}.lead{color:#d0bddb;line-height:1.7;font-size:14px}
.stage{position:relative;overflow:hidden;isolation:isolate;min-height:430px;margin:28px 0 20px;border:1px solid #ab80c8;border-radius:28px;background:radial-gradient(circle at 50% 58%,#77409876,transparent 52%),linear-gradient(145deg,#3c2453,#1a112f);box-shadow:inset 0 1px #ffe9ff55,0 18px 40px #07030e99}
.stage:before{content:'';position:absolute;inset:16px;border:1px solid #d6a6e83d;border-radius:22px;pointer-events:none}
.star{position:absolute;color:#f3d4ff;opacity:.55;text-shadow:0 0 12px #f3b9ff;animation:twinkle 2.8s ease-in-out infinite alternate}.s1{left:13%;top:16%}.s2{right:16%;top:24%;animation-delay:-1s}.s3{left:21%;bottom:20%;animation-delay:-2s}.s4{right:20%;bottom:16%;animation-delay:-.5s}
@keyframes twinkle{to{opacity:.15;transform:scale(.7)}}
.scene{position:relative;height:320px;display:grid;place-items:center}
.egg{position:absolute;width:150px;height:190px;border:3px solid #e6c4fa;border-radius:55% 55% 48% 48%/65% 65% 42% 42%;background:radial-gradient(circle at 31% 25%,#f2dfff 0,#bd81e2 36%,#653487 78%,#3e1d66);box-shadow:inset -14px -16px 20px #2d155c88,0 0 45px #b369f5a0;display:grid;place-items:center;font-size:42px;color:#ffdf9c;text-shadow:0 0 12px #fff0b3;transform-origin:50% 80%}
.egg:before{content:'';position:absolute;left:27px;top:27px;width:19px;height:32px;background:#fff8;border-radius:50%;transform:rotate(30deg)}
.relic{position:absolute;width:122px;height:122px;display:grid;place-items:center;font-size:80px;filter:drop-shadow(0 0 22px #ba84f9);opacity:0;transform:scale(.3)}
.scale{position:absolute;width:122px;height:148px;opacity:0;transform:translateY(50px) scale(.25) rotate(-25deg);filter:drop-shadow(0 0 20px #d79aff);background:linear-gradient(132deg,#f9dfff 8%,#b575eb 32%,#7534aa 65%,#33195e 94%);clip-path:polygon(50% 0,86% 19%,96% 54%,77% 82%,50% 100%,23% 82%,4% 54%,14% 19%);box-shadow:inset 0 0 20px #fff}
.scale:before{content:'';position:absolute;inset:10px;clip-path:polygon(50% 0,91% 31%,50% 82%,9% 31%);background:linear-gradient(100deg,#ffffffbb,#d9abfa22 65%)}
.scale:after{content:'';position:absolute;left:50%;top:14%;width:2px;height:70%;background:#fbe6ffb3;transform:rotate(0deg)}
.burst{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at center,#fff9 0,#dda8fc88 15%,transparent 58%)}
.caption{position:relative;z-index:2;min-height:74px;margin:0 28px;color:#f6dda7;font-size:18px;font-weight:700;line-height:1.5}
.caption small{display:block;color:#d1bde0;font-size:13px;font-weight:400;margin-top:5px}
.count{display:inline-flex;align-items:center;gap:12px;padding:12px 20px;margin-bottom:16px;border:1px solid #bd8dd2;border-radius:999px;background:#29183e;color:#f4dcae;font-weight:700}.count strong{font-size:23px;color:#fff}
button{display:block;width:100%;border:1px solid #f5d79b;border-radius:14px;padding:15px 18px;background:linear-gradient(105deg,#a36b34,#f0d38c 50%,#a66a32);color:#301d3a;font:700 17px system-ui;cursor:pointer;box-shadow:0 5px 18px #150816}button:disabled{opacity:.55;cursor:wait}.note{font-size:12px;color:#bbadc8;line-height:1.6}
.stage.play .egg{animation:eggLeave .9s .2s both}.stage.play .relic{animation:relicAppear .7s .65s both,relicLeave .5s 1.55s both}.stage.play .burst{animation:flash .5s 1.65s both}.stage.play .scale{animation:scaleArrive .95s 1.78s both}
@keyframes eggLeave{0%,35%{transform:rotate(-6deg)}20%,55%{transform:rotate(6deg)}80%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(.4)}}
@keyframes relicAppear{to{opacity:1;transform:scale(1)}}@keyframes relicLeave{to{opacity:0;transform:scale(1.5)}}
@keyframes flash{25%{opacity:1}100%{opacity:0}}@keyframes scaleArrive{45%{opacity:1;transform:translateY(-22px) scale(1.12) rotate(6deg)}70%{opacity:1;transform:translateY(10px) scale(.94) rotate(-3deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.stage.play .egg,.stage.play .relic{opacity:0}.stage.play .scale{opacity:1;transform:none}}
</style>
</head>
<body><main>
<div class="eyebrow">SHIRYUUIN TREASURY · EFFECT SAMPLE</div>
<h1>🐉 重複した秘宝のゆくえ</h1>
<p class="lead">同じボイスと再会したら、紫に輝く竜の鱗へ。</p>
<section class="stage" id="stage" aria-label="竜の鱗に変わる演出">
  <span class="star s1" aria-hidden="true">✦</span><span class="star s2" aria-hidden="true">✧</span><span class="star s3" aria-hidden="true">✧</span><span class="star s4" aria-hidden="true">✦</span>
  <div class="scene"><div class="egg" aria-hidden="true">✦</div><div class="relic" aria-hidden="true">💜</div><div class="burst" aria-hidden="true"></div><div class="scale" aria-hidden="true"></div></div>
  <div class="caption" id="caption" role="status">卵を孵化させてみよう<small>これは重複時の演出サンプルです</small></div>
</section>
<div class="count">竜の鱗 <strong id="count">0</strong> 枚</div>
<button id="play" type="button">🥚 重複演出を試す</button>
<p class="note">このページは見た目の試作です。宝物庫の抽選回数・獲得記録は変更しません。鱗の数もページを閉じるとリセットされます。</p>
</main>
<script>
const stage=document.getElementById('stage');
const caption=document.getElementById('caption');
const button=document.getElementById('play');
const count=document.getElementById('count');
let scales=0,timer;
button.addEventListener('click',()=>{
  if(button.disabled)return;
  clearTimeout(timer);button.disabled=true;stage.classList.remove('play');void stage.offsetWidth;
  caption.innerHTML='同じ秘宝と再会しました……<small>秘宝が新しい形へ変わっていきます</small>';
  stage.classList.add('play');
  timer=setTimeout(()=>{
    scales++;count.textContent=String(scales);
    caption.innerHTML='竜の鱗を1枚獲得！<small>重複した秘宝も、大切な宝物ですわ。</small>';
    button.disabled=false;button.textContent='🥚 もう一度見る';
  },2900);
});
</script></body></html>
