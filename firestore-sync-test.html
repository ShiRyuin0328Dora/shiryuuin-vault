<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>端末間の記録共有テスト｜紫竜院家宝物庫</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8ecff;background:#140d25}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#48245f,#140d25 70%)}
main{max-width:520px;margin:auto;padding:32px 18px 60px}h1{text-align:center;font-family:serif;font-size:clamp(26px,8vw,38px)}
.eyebrow{text-align:center;letter-spacing:.2em;color:#e0c281;font-size:11px}.card{background:#281a3a;border:1px solid #9a72b0;border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 10px 35px #0005}
p{line-height:1.7}.muted{color:#d4c2df;font-size:14px}.status{border:1px solid #a78cbd;background:#1b112b;border-radius:12px;padding:16px;min-height:68px;line-height:1.6}
.marker{font-size:32px;text-align:center;letter-spacing:.15em;min-height:1.5em}button{display:block;width:100%;padding:15px;margin-top:12px;border-radius:12px;border:1px solid #f5d994;font:700 16px system-ui;cursor:pointer;background:linear-gradient(120deg,#ba8d49,#f8df9f);color:#35233a}
button.secondary{background:#332047;color:#f8ecff;border-color:#be9cd1}button:disabled{opacity:.5;cursor:not-allowed}button[hidden]{display:none}a{color:#f8df9f}
</style>
</head>
<body><main>
<div class="eyebrow">SHIRYUUIN TREASURY · SYNC TEST</div><h1>🔑 記録共有テスト</h1>
<section class="card">
<p class="muted">同じGoogleアカウントで、iPadに保存した6桁の番号をiPhoneから読めるか試します。卵・抽選記録には触れません。</p>
<div id="status" class="status" role="status" aria-live="polite">Firebaseを読み込み中…</div>
<p id="marker" class="marker" aria-label="保存された番号">—</p>
<button id="login" type="button" disabled>Googleでログイン</button>
<button id="save" type="button" hidden>新しい番号を保存</button>
<button id="reload" class="secondary" type="button" hidden>保存された番号を読み直す</button>
<button id="logout" class="secondary" type="button" hidden>ログアウト</button>
</section>
<p class="muted">このページだけの試験用データです。<a href="./index.html">宝物庫に戻る</a></p>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
const app=initializeApp({
 apiKey:'AIzaSyDoOXzvQ-0Eg1yOlmzbXjk0ntlZjTtoTKA',
 authDomain:'shiryuuin-vault.firebaseapp.com',
 projectId:'shiryuuin-vault',
 storageBucket:'shiryuuin-vault.firebasestorage.app',
 messagingSenderId:'410153951418',
 appId:'1:410153951418:web:e0c8609d0248b87881a283'
});
const auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const el=id=>document.getElementById(id),login=el('login'),save=el('save'),reload=el('reload'),logout=el('logout'),status=el('status'),marker=el('marker');
let busy=false;
function show(message){status.textContent=message;}
function controls(){const signedIn=!!auth.currentUser;login.hidden=signedIn;save.hidden=reload.hidden=logout.hidden=!signedIn;for(const b of [login,save,reload,logout])b.disabled=busy;}
async function load(){
 const user=auth.currentUser;if(!user)return;
 busy=true;controls();show('保存された番号を確認中…');
 try{
  const snapshot=await getDoc(doc(db,'authChecks',user.uid));
  if(auth.currentUser?.uid!==user.uid)return;
  marker.textContent=snapshot.exists()?snapshot.data().marker:'—';
  show(snapshot.exists()?'このGoogleアカウントの番号を読み込みました。':'まだ番号がありません。iPadで「新しい番号を保存」を押してください。');
 }catch(error){show('読み込みに失敗しました：'+(error.code||'unknown')+'。Firestoreのルールを確認してください。');}
 finally{busy=false;controls();}
}
onAuthStateChanged(auth,user=>{marker.textContent='—';controls();if(user)void load();else show('未ログインです。Googleでログインしてください。');},error=>show('ログイン状態の確認に失敗しました：'+(error.code||'unknown')));
login.addEventListener('click',async()=>{
 if(busy)return;busy=true;controls();show('Googleのログイン画面を開いています…');
 try{await signInWithPopup(auth,provider);}catch(error){show('ログインに失敗しました：'+(error.code||'unknown'));}
 finally{busy=false;controls();}
});
save.addEventListener('click',async()=>{
 const user=auth.currentUser;if(!user||busy)return;
 const number=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
 busy=true;controls();show('番号を保存中…');
 try{
  await setDoc(doc(db,'authChecks',user.uid),{marker:number,updatedAt:serverTimestamp()});
  if(auth.currentUser?.uid!==user.uid)return;
  marker.textContent=number;show('保存できました。同じGoogleアカウントでiPhoneから開いてください。');
 }catch(error){show('保存に失敗しました：'+(error.code||'unknown')+'。Firestoreのルールを確認してください。');}
 finally{busy=false;controls();}
});
reload.addEventListener('click',()=>{if(!busy)void load();});
logout.addEventListener('click',async()=>{if(busy)return;busy=true;controls();try{await signOut(auth);}catch(error){show('ログアウトに失敗しました：'+(error.code||'unknown'));}finally{busy=false;controls();}});
</script>
</body></html>
