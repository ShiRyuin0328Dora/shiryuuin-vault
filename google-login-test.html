<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Googleログイン接続テスト｜紫竜院家宝物庫</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8ecff;background:#140d25}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#48245f,#140d25 70%)}
main{max-width:520px;margin:auto;padding:32px 18px 60px}.eyebrow{text-align:center;letter-spacing:.2em;color:#e0c281;font-size:11px}h1{text-align:center;font-family:serif;font-size:clamp(27px,8vw,38px)}
.card{background:#281a3a;border:1px solid #9a72b0;border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 10px 35px #0005}p{line-height:1.7}.muted{color:#d4c2df;font-size:14px}
button{display:block;width:100%;padding:15px;margin-top:12px;border-radius:12px;border:1px solid #f5d994;font:700 16px system-ui;cursor:pointer;background:linear-gradient(120deg,#ba8d49,#f8df9f);color:#35233a}button.secondary{background:#332047;color:#f8ecff;border-color:#be9cd1}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}
.status{border:1px solid #a78cbd;background:#1b112b;border-radius:12px;padding:16px;min-height:68px;line-height:1.6}a{color:#f8df9f}.foot{font-size:13px;color:#c8b8d4}
</style>
</head>
<body><main>
<div class="eyebrow">SHIRYUUIN TREASURY · AUTH TEST</div>
<h1>🔑 ログイン接続テスト</h1>
<section class="card">
<p class="muted">Googleでログインし、同じブラウザでログイン状態が残るかを確かめるページです。卵・鱗・鍵の付与やFirestoreへの読み書きはしません。</p>
<div id="status" class="status" role="status" aria-live="polite">Firebaseを読み込み中…</div>
<button id="login" type="button" disabled>Googleでログインを試す</button>
<button id="logout" class="secondary" type="button" hidden>ログアウトする</button>
</section>
<p class="foot">試験用の別ページです。ログインするとFirebase Authenticationに利用者アカウントが作成される場合があります。<a href="./index.html">宝物庫に戻る</a></p>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';

const app=initializeApp({
 apiKey:'AIzaSyDoOXzvQ-0Eg1yOlmzbXjk0ntlZjTtoTKA',
 authDomain:'shiryuuin-vault.firebaseapp.com',
 projectId:'shiryuuin-vault',
 storageBucket:'shiryuuin-vault.firebasestorage.app',
 messagingSenderId:'410153951418',
 appId:'1:410153951418:web:e0c8609d0248b87881a283'
});
const auth=getAuth(app),provider=new GoogleAuthProvider();
const status=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');
let busy=false;
function show(text){status.textContent=text;}
function controls(user){login.hidden=!!user;logout.hidden=!user;login.disabled=busy;logout.disabled=busy;}
onAuthStateChanged(auth,user=>{
 busy=false;
 controls(user);
 show(user?'ログイン成功！ このブラウザでログイン状態を確認できました。':'未ログインです。下のボタンで接続を試せます。');
},error=>{busy=false;controls(null);show('状態の確認に失敗しました：'+error.code);});
login.addEventListener('click',async()=>{
 if(busy)return;busy=true;controls(null);show('Googleのログイン画面を開いています…');
 try{await signInWithPopup(auth,provider);}
 catch(error){
  busy=false;controls(auth.currentUser);
  const hints={
   'auth/operation-not-allowed':'FirebaseでGoogleログインが有効になっていません。',
   'auth/unauthorized-domain':'このサイトのドメインがFirebaseの承認済みドメインに登録されていません。',
   'auth/popup-blocked':'ブラウザがログイン画面をブロックしました。Safariで直接ページを開いて試してください。',
   'auth/popup-closed-by-user':'ログイン画面を閉じました。もう一度試せます。',
   'auth/network-request-failed':'通信に失敗しました。接続を確認して再試行してください。'
  };
  show((hints[error.code]||'ログインを完了できませんでした。')+'（'+(error.code||'unknown')+'）');
 }
});
logout.addEventListener('click',async()=>{
 if(busy)return;busy=true;controls(auth.currentUser);show('ログアウト中…');
 try{await signOut(auth);}
 catch(error){busy=false;controls(auth.currentUser);show('ログアウトに失敗しました：'+error.code);}
});
</script>
</body>
</html>
